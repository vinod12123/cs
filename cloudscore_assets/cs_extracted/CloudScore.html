<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CloudScore · Reliable Economic Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; }
  :root {
    /* CloudScore Blue (default) */
    --bg: #050a14;
    --bg-2: #0a1223;
    --panel: #0e1830;
    --panel-2: #13203c;
    --line: #1d2a4a;
    --line-2: #2a3a60;
    --ink: #eaf0fb;
    --ink-dim: #9bb0d4;
    --ink-mute: #5a709a;
    --accent: #3b9fe0;         /* CloudScore azure — money/REI */
    --accent-2: #5ab8f0;       /* logo light ring */
    --accent-deep: #1e3a8a;    /* logo deep navy */
    --accent-ink: #041020;
    --signal: #5eead4;         /* electric mint-teal */
    --warn: #ffb259;           /* warm amber */
    --danger: #ff4d7a;          /* hot red-pink */
    --grid: rgba(91,184,240,0.05);
  }
  html, body { margin:0; padding:0; background: var(--bg); color: var(--ink); font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-feature-settings: "ss01","cv11"; }
  body { overflow-x: hidden; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: "ss01","cv11"; }
  .serif { font-family: 'Instrument Serif', serif; font-weight: 400; font-style: italic; }
  button { font-family: inherit; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent); color: var(--accent-ink); }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 32px; }

  /* subtle grid bg */
  .grid-bg {
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 56px 56px;
  }

  /* nav */
  .nav {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(14px);
    background: color-mix(in oklab, var(--bg) 82%, transparent);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner { display:flex; align-items:center; justify-content:space-between; height: 64px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight: 700; letter-spacing: -0.02em; font-size: 17px; }
  .brand-mark {
    width: 28px; height: 22px;
    background: transparent;
    position: relative;
  }
  .brand-mark::after { display:none; }
  .nav-links { display:flex; gap: 28px; color: var(--ink-dim); font-size: 14px; }
  .nav-links a:hover { color: var(--ink); }
  .nav-cta { display:flex; gap: 10px; align-items:center; }

  .btn {
    display:inline-flex; align-items:center; gap:8px;
    height: 38px; padding: 0 16px; border-radius: 999px;
    border: 1px solid var(--line-2); background: transparent; color: var(--ink);
    font-size: 14px; font-weight: 500; cursor: pointer; transition: 150ms;
  }
  .btn:hover { border-color: var(--ink-mute); background: var(--panel); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn-primary:hover { background: color-mix(in oklab, var(--accent) 86%, white); border-color: transparent; }
  .btn-ghost { border-color: transparent; }

  /* Theme-scoped high-specificity text color for nav CTAs (defensive — some browsers cache var resolution) */
  body[data-theme="dark"] .nav-cta .btn-ghost,
  body:not([data-theme]) .nav-cta .btn-ghost { color: #eaf0fb !important; }
  body[data-theme="light"] .nav-cta .btn-ghost { color: #061226 !important; }
  body[data-theme="electric"] .nav-cta .btn-ghost { color: #ffffff !important; }
  body[data-theme="light"] .nav-cta .btn-primary { color: #ffffff !important; }
  body[data-theme="dark"] .nav-cta .btn-primary,
  body:not([data-theme]) .nav-cta .btn-primary { color: #041020 !important; }
  body[data-theme="electric"] .nav-cta .btn-primary { color: #04101f !important; }

  /* section helpers */
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-dim);
  }
  .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 25%, transparent); }
  .eyebrow.signal .dot { background: var(--signal); box-shadow: 0 0 0 3px color-mix(in oklab, var(--signal) 25%, transparent); }

  h1,h2,h3 { font-family: 'Inter Tight', sans-serif; letter-spacing: -0.035em; margin: 0; font-weight: 600; }
  .h-display { font-size: clamp(44px, 6.6vw, 92px); line-height: 0.98; letter-spacing: -0.045em; font-weight: 600; }
  .h-section { font-size: clamp(36px, 4.4vw, 58px); line-height: 1.02; letter-spacing: -0.035em; }
  .lede { color: var(--ink-dim); font-size: 19px; line-height: 1.5; max-width: 620px; }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  }
  .card-pad { padding: 20px; }

  /* live dollar meter */
  .meter {
    background: radial-gradient(120% 160% at 0% 0%, color-mix(in oklab, var(--accent) 14%, var(--panel)) 0%, var(--panel) 55%);
    border: 1px solid var(--line);
    border-radius: 18px; padding: 22px;
    position: relative; overflow: hidden;
  }
  .meter::before {
    content:""; position: absolute; inset: -1px; border-radius: 18px;
    background: conic-gradient(from 140deg, transparent 0 65%, color-mix(in oklab, var(--accent) 45%, transparent) 72%, transparent 80%);
    -webkit-mask: linear-gradient(#000,#000) content-box, linear-gradient(#000,#000);
    -webkit-mask-composite: xor; mask-composite: exclude;
    padding: 1px; pointer-events: none; opacity: .6;
  }
  .meter-label { display:flex; justify-content: space-between; align-items:center; gap: 10px; flex-wrap: wrap; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-dim); }
  .meter-value { font-family: 'JetBrains Mono', monospace; font-size: clamp(26px, 2.8vw, 40px); letter-spacing: -0.04em; color: var(--accent); font-weight: 600; line-height: 1; margin: 12px 0 4px; }
  .meter-sub { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-dim); }

  /* Blink */
  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent) 55%, transparent); }
    100% { box-shadow: 0 0 0 14px transparent; }
  }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse-ring 1.5s infinite; }
  .live-dot.red { background: var(--danger); animation: pulse-ring-red 1.5s infinite; }
  @keyframes pulse-ring-red {
    0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--danger) 55%, transparent); }
    100% { box-shadow: 0 0 0 14px transparent; }
  }

  /* spark */
  .spark path { fill: none; stroke-width: 1.5; stroke-linecap: round; }

  /* tabs */
  .tabs { display:inline-flex; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; }
  .tab { padding: 8px 16px; border-radius: 999px; font-size: 13px; color: var(--ink-dim); cursor: pointer; border: 0; background: transparent; transition: 150ms; font-weight: 500; }
  .tab.active { background: var(--ink); color: var(--bg); }

  /* investigation log */
  .inv-step { display:flex; gap: 12px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .inv-check { width: 18px; height: 18px; border-radius: 50%; background: color-mix(in oklab, var(--accent) 20%, transparent); display:grid; place-items:center; flex: none; margin-top: 2px; border: 1px solid color-mix(in oklab, var(--accent) 40%, transparent); }
  .inv-check svg { width: 10px; height: 10px; stroke: var(--accent); }
  .inv-check.pending { background: transparent; border-color: var(--line-2); }
  .inv-step-title { font-size: 13px; font-weight: 500; }
  .inv-step-meta { font-size: 12px; color: var(--ink-dim); margin-top: 2px; font-family: 'JetBrains Mono', monospace; }

  /* evidence pill */
  .pill { display:inline-flex; align-items:center; gap:6px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-family: 'JetBrains Mono', monospace; background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-dim); }
  .pill.hi { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 35%, transparent); background: color-mix(in oklab, var(--accent) 8%, var(--panel-2)); }
  .pill.warn { color: var(--warn); border-color: color-mix(in oklab, var(--warn) 35%, transparent); background: color-mix(in oklab, var(--warn) 8%, var(--panel-2)); }
  .pill.danger { color: var(--danger); border-color: color-mix(in oklab, var(--danger) 35%, transparent); background: color-mix(in oklab, var(--danger) 8%, var(--panel-2)); }
  .pill.signal { color: var(--signal); border-color: color-mix(in oklab, var(--signal) 35%, transparent); background: color-mix(in oklab, var(--signal) 8%, var(--panel-2)); }

  /* footer */
  .footer { border-top: 1px solid var(--line); padding: 64px 0 40px; color: var(--ink-dim); font-size: 14px; }

  /* marquee */
  .marquee { overflow: hidden; mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); }
  .marquee-track { display: flex; gap: 48px; animation: scroll 40s linear infinite; width: max-content; }
  @keyframes scroll { to { transform: translateX(-50%); } }
  @keyframes feedIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* THEMES ===== */
  body[data-theme="light"] {
    --bg:#f2f7ff; --bg-2:#e6efff; --panel:#ffffff; --panel-2:#f4f9ff;
    --line:#d8e4f7; --line-2:#bcceea;
    --ink:#061226; --ink-dim:#3e5373; --ink-mute:#7a8aa8;
    --accent:#1570c7; --accent-2:#2e8de0; --accent-deep:#0b2f6b;
    --accent-ink:#ffffff;
    --signal:#0a9b8e; --warn:#b8661d; --danger:#c2305b;
    --grid: rgba(59,159,224,0.06);
  }
  body[data-theme="electric"] {
    --bg:#030712; --bg-2:#061024; --panel:#0a1830; --panel-2:#0f2240;
    --line:#152a52; --line-2:#20396a;
    --ink:#ffffff; --ink-dim:#a7c0e6; --ink-mute:#5775a8;
    --accent:#58c4ff; --accent-2:#7ad7ff; --accent-deep:#1d48c4;
    --signal:#66ffe0; --warn:#ffc071; --danger:#ff5b90;
    --accent-ink:#04101f;
    --grid: rgba(88,196,255,0.07);
  }

  /* Tweak panel */
  .tweaks {
    position: fixed; right: 20px; bottom: 20px; z-index: 100;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; width: 280px; display: none;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
  }
  .tweaks.open { display: block; }
  .tweak-row { display:flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .tweak-label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); font-family: 'JetBrains Mono', monospace; }
  .tweak-options { display:flex; gap: 6px; flex-wrap: wrap; }
  .tweak-opt { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line-2); font-size: 12px; background: var(--panel-2); color: var(--ink); cursor: pointer; }
  .tweak-opt.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* hero ticker */
  .ticker { display: inline-flex; overflow: hidden; height: 1.1em; vertical-align: bottom; }
  .ticker-list { animation: tick 9s infinite; }
  @keyframes tick {
    0%,18% { transform: translateY(0); }
    22%,40% { transform: translateY(-100%); }
    44%,62% { transform: translateY(-200%); }
    66%,100% { transform: translateY(0); }
  }

  /* use case card feature */
  .uc-card {
    display: grid; grid-template-columns: 1.05fr 1fr; gap: 0;
    border: 1px solid var(--line); border-radius: 22px; overflow: hidden;
    background: var(--panel);
  }
  .uc-card .left { padding: 44px; border-right: 1px solid var(--line); }
  .uc-card .right { padding: 28px; background: var(--bg-2); position: relative; }
  @media (max-width: 900px) {
    .uc-card { grid-template-columns: 1fr; }
    .uc-card .left { border-right: 0; border-bottom: 1px solid var(--line); padding: 28px; }
  }

  .kbd { font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 2px 6px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--panel-2); color: var(--ink-dim); }

  /* number ticker animation */
  .n-digit { display: inline-block; }

</style>
</head>
<body data-theme="dark">
  <div id="root"></div>

  <script type="application/json" id="tweak-defaults">

  "showMeter": true

  <script type="text/babel" data-presets="react">
/* ---------- helpers ---------- */
const { useState, useEffect, useRef, useMemo } = React;

function useInterval(fn, ms) {
  useEffect(() => {
    const id = setInterval(fn, ms);
    return () => clearInterval(id);
  }, [ms, fn]);
}

function BrandMark({ size = 28 }) {
  return (
    <img src="cloudscore-mark.png" alt="CloudScore"
      style={{height: size, width: 'auto', display:'block', objectFit: 'contain'}}
    />
  );
}

function fmtMoney(n) {
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

/* ---------- Sparkline ---------- */
function Spark({ data, color = 'var(--accent)', height = 36, width = 120, fill }) {
  const max = Math.max(...data), min = Math.min(...data);
  const w = width, h = height;
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((v - min) / (max - min || 1)) * (h - 4) - 2;
    return [x, y];
  });
  const path = pts.map((p,i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const area = path + ` L ${w},${h} L 0,${h} Z`;
  return (
    <svg className="spark" width={w} height={h} style={{display:'block'}}>
      {fill && <path d={area} fill={fill} stroke="none" />}
      <path d={path} stroke={color} />
    </svg>
  );
}

/* ---------- Agent Orchestra (hero animation) ---------- */
function AgentOrchestra() {
  const AGENTS = [
    { id: 'rei', name: 'REI', role: 'Revenue-at-risk pricing', color: '#67c9f5', angle: -90 },
    { id: 'sre', name: 'SRE', role: 'Service health triage', color: '#ffb86b', angle: -36 },
    { id: 'fin', name: 'FinOps', role: 'Cost anomaly detection', color: '#8ae6a3', angle: 18 },
    { id: 'sec', name: 'SecOps', role: 'IAM & posture scan', color: '#c99cf5', angle: 72 },
    { id: 'dep', name: 'Deploy', role: 'Pre-merge gate', color: '#f59cb8', angle: 144 },
    { id: 'dat', name: 'Data', role: 'Query cost analysis', color: '#7ce1d4', angle: 216 },
  ];
  const EVENTS = [
    { agent: 'rei', text: 'Pricing P1 at $214/min burn', kind: 'analysis' },
    { agent: 'sre', text: 'Spike in 5xx on payments-api', kind: 'detect' },
    { agent: 'fin', text: 'us-east-1 egress +38% vs baseline', kind: 'detect' },
    { agent: 'rei', text: 'Hypothesis #7: DB connection starvation · $892 exposed', kind: 'hyp' },
    { agent: 'sre', text: 'Correlating deploy sha 8a2f7c → 5xx onset', kind: 'analysis' },
    { agent: 'fin', text: 'Idle GPU cluster in staging · $1,240/day', kind: 'savings' },
    { agent: 'sec', text: 'Over-privileged role detected on eks-prod', kind: 'detect' },
    { agent: 'rei', text: 'Root cause ranked · confidence 94%', kind: 'result' },
    { agent: 'dep', text: 'PR #4821 blocked · projected +$4,200/mo', kind: 'block' },
    { agent: 'dat', text: 'Expensive query patterns isolated · 3 offenders', kind: 'analysis' },
    { agent: 'fin', text: 'Commitment coverage at 71% · recommend +$12k RIs', kind: 'savings' },
    { agent: 'sre', text: 'Rollback proposed · ETA 42s', kind: 'result' },
  ];
  const KIND_META = {
    detect:   { label: 'DETECT',   tone: '#ffb86b' },
    analysis: { label: 'ANALYZE',  tone: '#67c9f5' },
    hyp:      { label: 'HYPOTHESIS', tone: '#c99cf5' },
    result:   { label: 'RESULT',   tone: '#8ae6a3' },
    savings:  { label: 'SAVINGS',  tone: '#8ae6a3' },
    block:    { label: 'BLOCK',    tone: '#f59cb8' },
  };
  const [active, setActive] = useState(null);      // event index currently firing
  const [feed, setFeed] = useState([]);            // rolling feed entries

  // Pulse loop — fire one event every 1.9s
  useEffect(() => {
    let i = 0;
    let k = 0;
    const step = () => {
      const ev = EVENTS[i % EVENTS.length];
      k++;
      const entry = { ...ev, key: k };
      setActive(entry);
      setFeed(prev => [entry, ...prev].slice(0, 5));
      i++;
    };
    step();
    const id = setInterval(step, 1900);
    return () => clearInterval(id);
  }, []);

  const R = 148;   // orbit radius
  const CX = 210;  // center X of the constellation
  const CY = 210;

  return (
    <div style={{
      marginTop: 56,
      display:'grid', gridTemplateColumns: '1fr 1.2fr', gap: 24,
      border: '1px solid var(--line)', borderRadius: 18,
      background: 'linear-gradient(180deg, var(--panel) 0%, var(--bg) 100%)',
      overflow: 'hidden'
    }}>
      {/* Left: orbital constellation */}
      <div style={{position:'relative', height: 420}}>
        <svg width="100%" height="100%" viewBox="0 0 420 420" style={{display:'block'}}>
          <defs>
            <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stopColor="var(--accent)" stopOpacity="0.45"/>
              <stop offset="100%" stopColor="var(--accent)" stopOpacity="0"/>
            </radialGradient>
          </defs>
          {/* Concentric rings */}
          {[R, R*0.72, R*0.44].map((r, i) => (
            <circle key={i} cx={CX} cy={CY} r={r}
              fill="none" stroke="var(--line)" strokeWidth="1"
              strokeDasharray={i === 0 ? '4 6' : 'none'} opacity={0.7 - i*0.15}/>
          ))}
          {/* Core glow */}
          <circle cx={CX} cy={CY} r="90" fill="url(#coreGrad)"/>
          {/* Links from agents to core, highlight active */}
          {AGENTS.map((a) => {
            const rad = (a.angle * Math.PI) / 180;
            const x = CX + Math.cos(rad) * R;
            const y = CY + Math.sin(rad) * R;
            const isActive = active && active.agent === a.id;
            return (
              <g key={a.id}>
                <line x1={CX} y1={CY} x2={x} y2={y}
                  stroke={isActive ? a.color : 'var(--line-soft, var(--line))'}
                  strokeWidth={isActive ? 1.6 : 1}
                  opacity={isActive ? 0.9 : 0.35}/>
                {/* Animated dot traveling inward on activation */}
                {isActive && (
                  <circle r="4" fill={a.color}>
                    <animate attributeName="cx" from={x} to={CX} dur="1.2s" fill="freeze"/>
                    <animate attributeName="cy" from={y} to={CY} dur="1.2s" fill="freeze"/>
                    <animate attributeName="opacity" from="1" to="0" dur="1.2s" fill="freeze"/>
                  </circle>
                )}
              </g>
            );
          })}
          {/* Core label */}
          <g>
            <circle cx={CX} cy={CY} r="44" fill="var(--panel-2)" stroke="var(--accent)" strokeWidth="1.5"/>
            <text x={CX} y={CY - 4} textAnchor="middle" fontFamily="Space Grotesk, sans-serif"
              fontSize="15" fontWeight="600" fill="var(--ink)">ASTRA</text>
            <text x={CX} y={CY + 14} textAnchor="middle" fontFamily="JetBrains Mono, monospace"
              fontSize="9" fill="var(--ink-dim)" letterSpacing="1.5">CORE</text>
          </g>
          {/* Agent nodes */}
          {AGENTS.map((a) => {
            const rad = (a.angle * Math.PI) / 180;
            const x = CX + Math.cos(rad) * R;
            const y = CY + Math.sin(rad) * R;
            const isActive = active && active.agent === a.id;
            return (
              <g key={a.id} transform={`translate(${x}, ${y})`}>
                {isActive && (
                  <circle r="26" fill="none" stroke={a.color} strokeWidth="1.5" opacity="0.4">
                    <animate attributeName="r" from="18" to="34" dur="1.2s" fill="freeze"/>
                    <animate attributeName="opacity" from="0.7" to="0" dur="1.2s" fill="freeze"/>
                  </circle>
                )}
                <circle r="18" fill="var(--panel-2)" stroke={a.color} strokeWidth={isActive ? 2 : 1}/>
                <text y="4" textAnchor="middle" fontFamily="Space Grotesk, sans-serif"
                  fontSize="10" fontWeight="600" fill="var(--ink)">{a.name}</text>
                {/* Role caption on outside */}
                <text
                  y={a.angle > 0 && a.angle < 180 ? 34 : -26}
                  textAnchor="middle" fontFamily="JetBrains Mono, monospace"
                  fontSize="9" fill="var(--ink-dim)" letterSpacing="0.5">{a.role}</text>
              </g>
            );
          })}
        </svg>

function BudgetBar({pct, color}) {
  return (
    <div style={{marginTop: 8, height: 5, background:'var(--line)', borderRadius: 99, overflow:'hidden'}}>
      <div style={{width: pct + '%', height:'100%', background: color, borderRadius: 99}}/>
    </div>
  );
}

function ScoreDial({score}) {
  const r = 48, c = 2 * Math.PI * r;
  const pct = score / 100;
  const col = score >= 70 ? 'var(--danger)' : score >= 40 ? 'var(--warn)' : 'var(--accent)';
  return (
    <div style={{position:'relative', width: 128, height: 128}}>
      <svg width="128" height="128" viewBox="0 0 128 128" style={{transform:'rotate(-90deg)'}}>
        <circle cx="64" cy="64" r={r} stroke="var(--line-2)" strokeWidth="8" fill="none"/>
        <circle cx="64" cy="64" r={r} stroke={col} strokeWidth="8" fill="none"
          strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c*(1-pct)} style={{transition:'stroke-dashoffset 600ms ease'}}/>
      </svg>
      <div style={{position:'absolute', inset: 0, display:'grid', placeItems:'center', textAlign:'center'}}>
        <div>
          <div className="mono" style={{fontSize: 32, fontWeight: 600, lineHeight: 1, color: col}}>{score}</div>
          <div className="mono" style={{fontSize: 10, color:'var(--ink-dim)', letterSpacing:'.1em', marginTop: 2}}>PERS</div>
        </div>
      </div>
    </div>
  );
}

                <span>{featured.read}</span>
                <span>·</span>

              <svg width="100%" height="100%" viewBox="0 0 500 320" preserveAspectRatio="xMidYMid slice" style={{position:'absolute', inset:0}}>
                <defs>
                  <linearGradient id="rFill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="var(--accent)" stopOpacity="0.4"/>
                    <stop offset="100%" stopColor="var(--accent)" stopOpacity="0"/>
                  </linearGradient>
                </defs>
                {/* horizontal grid */}
                {[60, 120, 180, 240].map(y => (
                  <line key={y} x1="0" x2="500" y1={y} y2={y} stroke="var(--line)" strokeDasharray="2 4" opacity="0.4"/>
                ))}
                {/* pre-AI spend (going up) */}
                <path d="M20 260 C 60 250, 100 235, 140 215 C 180 200, 220 180, 260 145" fill="none" stroke="var(--ink-dim)" strokeWidth="2" strokeDasharray="4 4" opacity="0.6"/>
                <text x="100" y="240" fill="var(--ink-dim)" fontSize="11" fontFamily="JetBrains Mono, monospace" opacity="0.7">manual ops</text>
                {/* AI-driven savings (going down) */}
                <path d="M260 145 C 300 135, 340 115, 380 95 C 420 80, 460 75, 480 72" fill="none" stroke="var(--accent)" strokeWidth="2.5"/>
                <path d="M260 145 C 300 135, 340 115, 380 95 C 420 80, 460 75, 480 72 L 480 280 L 260 280 Z" fill="url(#rFill)"/>
                {/* inflection dot */}
                <circle cx="260" cy="145" r="7" fill="var(--accent)"/>
                <circle cx="260" cy="145" r="14" fill="none" stroke="var(--accent)" strokeWidth="1" opacity="0.4"/>
                <text x="268" y="130" fill="var(--accent)" fontSize="11" fontFamily="JetBrains Mono, monospace" fontWeight="600">AI ON</text>
                {/* labels */}
                <text x="20" y="40" fill="var(--ink)" fontSize="12" fontFamily="Space Grotesk, sans-serif" fontWeight="600">Cloud spend · $/mo</text>
              </svg>
            </div>
          </div>
        </a>

        {/* Grid */}
        <div style={{display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap: 20}}>
          {posts.map((p, i) => (
            <a key={i} href={p.href} target="_blank" rel="noreferrer" style={{display:'flex', flexDirection:'column', textDecoration:'none', padding: 28, border:'1px solid var(--line)', borderRadius: 14, background:'var(--panel)', transition:'220ms', minHeight: 260}}
              onMouseEnter={(e)=>{e.currentTarget.style.borderColor='var(--accent)'; e.currentTarget.style.transform='translateY(-2px)'}}
              onMouseLeave={(e)=>{e.currentTarget.style.borderColor='var(--line)'; e.currentTarget.style.transform='translateY(0)'}}>
              <div className="mono" style={{fontSize: 10.5, letterSpacing: 2, color:'var(--accent)', marginBottom: 16}}>{p.cat.toUpperCase()}</div>
              <h4 style={{fontFamily:'Space Grotesk, sans-serif', fontSize: 18, fontWeight: 600, color:'var(--ink)', lineHeight: 1.3, margin: 0, letterSpacing:'-0.01em'}}>{p.title}</h4>
              <p style={{color:'var(--ink-dim)', fontSize: 13.5, lineHeight: 1.55, marginTop: 12, flex: 1}}>{p.excerpt}</p>
              <div className="mono" style={{fontSize: 11, color:'var(--ink-mute)', marginTop: 16, display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                <span>{p.read}</span>
                <span style={{color:'var(--accent)'}}>Read →</span>

      </div>
    </section>
  );
}

/* ---------- Tweaks ---------- */
function Tweaks({open, theme, setTheme}) {
  if (!open) return null;
  const themes = [['dark','CloudScore Blue'],['light','Sky Daylight'],['electric','Azure Keynote']];
  return (
    <div className="tweaks open">
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom: 14}}>
        <div className="mono" style={{fontSize: 12, letterSpacing:'.12em'}}>TWEAKS</div>
        <div className="mono" style={{fontSize: 10, color:'var(--ink-dim)'}}>press T to toggle</div>
      </div>
      <div className="tweak-row">
        <div className="tweak-label">Theme</div>
        <div className="tweak-options">
          {themes.map(([k, n]) => (
            <button key={k} className={'tweak-opt' + (theme === k ? ' on' : '')} onClick={() => setTheme(k)}>{n}</button>
          ))}
        </div>
      </div>
      <div style={{fontSize: 12, color:'var(--ink-dim)', lineHeight: 1.5, marginTop: 14, paddingTop: 14, borderTop:'1px solid var(--line)'}}>
        Three curated themes harmonized with the CloudScore logo. "CloudScore Blue" is the default — azure-on-navy command center. "Sky Daylight" is the editorial light mode. "Azure Keynote" is the high-contrast presentation mode.
      </div>
    </div>
  );
}

/* ---------- App ---------- */
function App() {
  const defaults = JSON.parse(document.getElementById('tweak-defaults').textContent.match(/\{[\s\S]*\}/)[0]);
  const [theme, setThemeRaw] = useState(defaults.theme || 'dark');
  const [tweaksOpen, setTweaksOpen] = useState(false);

  useEffect(() => {
    document.body.setAttribute('data-theme', theme);
  }, [theme]);

  const setTheme = (t) => {
    setThemeRaw(t);
    try { window.parent.postMessage({type:'__edit_mode_set_keys', edits:{theme: t}}, '*'); } catch(e){}
  };

  useEffect(() => {
    const onMsg = (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', onMsg);
    try { window.parent.postMessage({type:'__edit_mode_available'}, '*'); } catch(e){}
    const onKey = (e) => { if (e.key === 't' || e.key === 'T') setTweaksOpen(o => !o); };
    window.addEventListener('keydown', onKey);
    return () => { window.removeEventListener('message', onMsg); window.removeEventListener('keydown', onKey); };
  }, []);

  return (
    <>
      <Nav />
      <Hero />
      <LogosMarquee />
      <REISection />
      <UseCaseRCA />
      <UseCasePERS />
      <UseCaseFinOps />
      <AstraSection />
      <ResourcesSection />
      <CTA />
      <Footer />
      <Tweaks open={tweaksOpen} theme={theme} setTheme={setTheme} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
